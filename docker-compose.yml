version: "3.9"

services:
  api:
    build:
      context: ./backend
    container_name: ai_gen_api
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - minio
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
    container_name: ai_gen_worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    depends_on:
      - api
      - redis
      - db
      - minio
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: ai_gen_frontend
    env_file:
      - ./frontend/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules

  db:
    image: postgres:16-alpine
    container_name: ai_gen_db
    environment:
      POSTGRES_DB: aigeneration
      POSTGRES_USER: aigeneration
      POSTGRES_PASSWORD: aigeneration
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai_gen_redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: ai_gen_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
